name: Production CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Backend Tests, Frontend Tests & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Verify Test Isolation Setup Imports
        run: npm run check:test-setup

      - name: TypeScript Typecheck & Build Shared Contracts
        run: npm run typecheck

      - name: Validate OpenAPI 3.0 Specification
        run: npx @redocly/cli lint docs/openapi-v1.yaml

      - name: Run Backend Parallel Test Suite & Verify Hermetic Working Tree
        run: npm run check:hermetic

      - name: Run Frontend Unit Tests
        run: npm --prefix frontend test -- --run

      - name: Build Frontend for Production
        run: npm --prefix frontend run build

  turso-parity:
    name: Turso LibSQL Dialect Parity Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cleanly skip if on a fork PR where secrets cannot be evaluated
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Check Turso Secrets
        id: check_secrets
        env:
          URL: ${{ secrets.TURSO_DATABASE_URL }}
          TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -n "$URL" ] && [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Turso parity testing enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Turso secrets not available. Skipping parity test."
          fi

      - name: Install Root Dependencies
        if: steps.check_secrets.outputs.enabled == 'true'
        run: npm ci

      - name: Install Backend Dependencies
        if: steps.check_secrets.outputs.enabled == 'true'
        run: cd backend && npm ci

      - name: Run Backend Test Suite with Turso Parity
        if: steps.check_secrets.outputs.enabled == 'true'
        env:
          TEST_USE_TURSO: 'true'
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_TABLE_PREFIX: ci_${{ github.run_id }}_
        run: npm run test:turso

      - name: Cleanup Ephemeral Turso Test Tables
        if: always() && steps.check_secrets.outputs.enabled == 'true'
        env:
          TEST_USE_TURSO: 'true'
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_TABLE_PREFIX: ci_${{ github.run_id }}_
        run: node scripts/cleanup-turso-ci.js

