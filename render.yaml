services:
  - type: web
    name: executive-dashboard-qbr-2
    env: node
    plan: free
    region: singapore          # closest to India
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ADMIN_PASSWORD
        # SECURITY: Do NOT set a plaintext value here.
        # Set ADMIN_PASSWORD as a Secret in the Render Dashboard:
        # Dashboard → executive-dashboard-qbr-2 → Environment → Secret Files
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://executive-dashboard-qbr-2.onrender.com
