services:
  - type: web
    name: executive-dashboard-qbr-2
    env: node
    plan: free
    region: singapore          # closest to India
    buildCommand: npm install && cd frontend && npm install && npm run build && cd ..
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ADMIN_PASSWORD
        value: admin123
      - key: ALLOWED_ORIGINS
        value: https://executive-dashboard-qbr-2.onrender.com
