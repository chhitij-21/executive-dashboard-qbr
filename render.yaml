services:
  - type: web
    name: qbr-dashboard
    env: node
    plan: free
    region: singapore          # closest to India
    buildCommand: npm install && cd frontend && npm install && npm run build && cd ..
    startCommand: npm start 
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        generateValue: true        # Render auto-generates a secure random value
      - key: ALLOWED_ORIGINS
        value: https://qbr-dashboard.onrender.com
