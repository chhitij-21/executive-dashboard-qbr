          type: object
          properties:
            start_date: { type: string }
            end_date: { type: string }
            display_label: { type: string }
        generatedAt: { type: string }
        executiveSummary: { type: object }
        siteSummary:
          type: array
          items: { type: object }
        switchAnalytics: { type: object }
        apAnalytics: { type: object }
        incidentAnalytics: { type: object }
        rcaAnalytics: { type: object }
        slaAnalytics: { type: object }
        anomalies:
          type: array
          items: { $ref: '#/components/schemas/Anomaly' }
        anomalySummary: { $ref: '#/components/schemas/AnomalySummary' }

    DataHealthReport:
      type: object
      properties:
